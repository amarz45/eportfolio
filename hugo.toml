baseURL = "https://amarz45.github.io/eportfolio/"
locale = "en-ca"
title = "Amar Al-Zubaidi"
theme = "PaperMod"

# No taxonomies on this site; stop Hugo generating empty /tags/ and /categories/.
disableKinds = ["taxonomy", "term"]

[params]
  author   = "Amar Al-Zubaidi"
  hideAuthor = true
  mainSections = []
  email    = "amar.al-zubaidi@proton.me"
  linkedin = "https://www.linkedin.com/in/amar-al"

[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 2
  [[menu.main]]
    name = "Writings"
    pageRef = "/writings"
    weight = 3
  [[menu.main]]
    name = "Career"
    pageRef = "/career"
    weight = 4
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 5

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML in Markdown

# Fail the build on a broken internal link instead of silently shipping it.
refLinksErrorLevel = "ERROR"
